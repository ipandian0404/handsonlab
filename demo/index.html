<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DreamGuard Claims Workbench</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--cp-text);
      background: var(--cp-bg);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
    .topbar { border-bottom: 1px solid var(--cp-border); background: var(--cp-surface); }
    .topbar .shell { display: flex; align-items: center; justify-content: space-between; min-height: 66px; gap: 20px; }
    .brand { font-weight: 800; }
    .brand span { color: var(--cp-accent); }
    .guide-link { color: var(--cp-link); font-weight: 700; text-decoration: none; }
    main { padding: 38px 0 64px; }
    .heading { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.6rem); line-height: 1; letter-spacing: 0; }
    .heading p { max-width: 540px; margin: 12px 0 0; color: var(--cp-text-soft); }
    .synthetic { color: var(--cp-warning); font-size: 0.76rem; font-weight: 800; text-transform: uppercase; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(320px, 0.85fr); border: 1px solid var(--cp-border); background: var(--cp-surface); border-radius: 8px; overflow: hidden; box-shadow: var(--cp-shadow); }
    .form-panel, .result-panel { padding: clamp(24px, 4vw, 42px); }
    .result-panel { display: flex; flex-direction: column; min-height: 560px; background: var(--cp-surface-soft); border-left: 1px solid var(--cp-border); }
    h2 { margin: 0 0 20px; font-size: 1.15rem; letter-spacing: 0; }
    .presets { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
    .preset { padding: 8px 12px; color: var(--cp-text); background: var(--cp-surface-soft); border: 1px solid var(--cp-border); border-radius: 6px; }
    .preset:hover, .preset:focus-visible { border-color: var(--cp-accent); }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    label, fieldset { min-width: 0; }
    label span, legend { display: block; margin-bottom: 7px; color: var(--cp-text-soft); font-size: 0.82rem; font-weight: 700; }
    input, select { width: 100%; min-height: 44px; padding: 9px 11px; color: var(--cp-text); background: var(--cp-bg-elevated); border: 1px solid var(--cp-border-strong); border-radius: 6px; }
    input:focus, select:focus { outline: 2px solid var(--cp-accent); outline-offset: 2px; }
    fieldset { grid-column: 1 / -1; margin: 0; padding: 0; border: 0; }
    .checks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .check { display: flex; align-items: center; gap: 8px; padding: 11px; background: var(--cp-bg-elevated); border: 1px solid var(--cp-border); border-radius: 6px; }
    .check input { width: 17px; min-height: 17px; accent-color: var(--cp-accent); }
    .check span { margin: 0; overflow-wrap: anywhere; font-size: 0.78rem; }
    .assess { width: 100%; min-height: 48px; margin-top: 26px; color: var(--cp-accent-fg); background: var(--cp-accent); border: 1px solid var(--cp-accent); border-radius: 6px; font-weight: 800; }
    .assess:hover { background: var(--cp-accent-hover); }
    .assess:disabled { opacity: 0.65; cursor: wait; }
    .result-empty { display: grid; flex: 1; place-items: center; color: var(--cp-text-muted); text-align: center; }
    .result { display: flex; flex: 1; flex-direction: column; }
    .status { align-self: flex-start; padding: 7px 10px; border: 1px solid currentColor; border-radius: 5px; font-size: 0.76rem; font-weight: 900; text-transform: uppercase; }
    .status.approved { color: var(--cp-success); }
    .status.pending_documents, .status.referred { color: var(--cp-warning); }
    .status.rejected { color: var(--cp-danger); }
    .amount { margin: auto 0; }
    .amount span { display: block; color: var(--cp-text-muted); font-size: 0.8rem; text-transform: uppercase; }
    .amount strong { display: block; margin-top: 4px; font-size: clamp(2rem, 5vw, 3.3rem); overflow-wrap: anywhere; }
    .reasons { padding-top: 22px; border-top: 1px solid var(--cp-border); }
    .reasons p { margin: 0 0 8px; color: var(--cp-text-muted); font-size: 0.8rem; font-weight: 800; text-transform: uppercase; }
    .reasons ul { margin: 0; padding-left: 20px; }
    .error { color: var(--cp-danger); }
    @media (max-width: 800px) {
      .heading { display: block; }
      .workspace { grid-template-columns: 1fr; }
      .result-panel { min-height: 340px; border-top: 1px solid var(--cp-border); border-left: 0; }
    }
    @media (max-width: 540px) {
      .fields, .checks { grid-template-columns: 1fr; }
      .topbar .shell { align-items: flex-start; flex-direction: column; justify-content: center; padding: 14px 0; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="shell">
      <div class="brand"><span>DreamGuard</span> Claims Workbench</div>
      <a class="guide-link" href="/challenge/">Back to race guide</a>
    </div>
  </header>
  <main class="shell">
    <div class="heading">
      <div>
        <div class="synthetic">Synthetic training data only</div>
        <h1>Assess a claim</h1>
        <p>Exercise the live Python decision rules and inspect the outcome returned by the service.</p>
      </div>
    </div>
    <section class="workspace">
      <form class="form-panel" id="claimForm">
        <h2>Claim details</h2>
        <div class="presets" aria-label="Claim presets">
          <button class="preset" type="button" data-preset="approved">Approved</button>
          <button class="preset" type="button" data-preset="pending">Pending</button>
          <button class="preset" type="button" data-preset="referred">Referred</button>
          <button class="preset" type="button" data-preset="rejected">Rejected</button>
        </div>
        <div class="fields">
          <label><span>Policy number</span><input id="policyNumber" required value="SYN-UI-1001"></label>
          <label><span>Claim type</span><select id="claimType"><option value="life">Life</option><option value="disability">Disability</option><option value="travel">Travel (unsupported)</option></select></label>
          <label><span>Amount (ZAR)</span><input id="amount" required inputmode="decimal" value="250000.00"></label>
          <label><span>Policy active (months)</span><input id="monthsActive" required type="number" value="24"></label>
          <fieldset>
            <legend>Documents supplied</legend>
            <div class="checks">
              <label class="check"><input type="checkbox" name="documents" value="identity_document" checked><span>Identity document</span></label>
              <label class="check"><input type="checkbox" name="documents" value="death_certificate" checked><span>Death certificate</span></label>
              <label class="check"><input type="checkbox" name="documents" value="medical_report"><span>Medical report</span></label>
            </div>
          </fieldset>
        </div>
        <button class="assess" id="assessButton" type="submit">Assess claim</button>
      </form>
      <aside class="result-panel" aria-live="polite">
        <h2>Decision</h2>
        <div class="result-empty" id="result"><p>Select a preset or submit the claim to see the live result.</p></div>
      </aside>
    </section>
  </main>
  <script>
    const form = document.querySelector("#claimForm");
    const result = document.querySelector("#result");
    const assessButton = document.querySelector("#assessButton");
    const presets = {
      approved: { claimType: "life", amount: "250000.00", months: "24", documents: ["identity_document", "death_certificate"] },
      pending: { claimType: "life", amount: "125000.00", months: "12", documents: [] },
      referred: { claimType: "disability", amount: "80000.00", months: "2", documents: ["identity_document", "medical_report"] },
      rejected: { claimType: "travel", amount: "10000.00", months: "12", documents: [] }
    };

    function applyPreset(name) {
      const preset = presets[name];
      document.querySelector("#claimType").value = preset.claimType;
      document.querySelector("#amount").value = preset.amount;
      document.querySelector("#monthsActive").value = preset.months;
      document.querySelectorAll('[name="documents"]').forEach(input => {
        input.checked = preset.documents.includes(input.value);
      });
    }

    function showDecision(decision) {
      const reasons = decision.reasons.length
        ? `<ul>${decision.reasons.map(reason => `<li>${reason}</li>`).join("")}</ul>`
        : "<span>No exceptions. The claim passed every rule.</span>";
      result.className = "result";
      result.innerHTML = `<div class="status ${decision.status}">${decision.status.replace("_", " ")}</div><div class="amount"><span>Approved amount</span><strong>R ${decision.approved_amount}</strong></div><div class="reasons"><p>Decision reasons</p>${reasons}</div>`;
    }

    document.querySelectorAll("[data-preset]").forEach(button => {
      button.addEventListener("click", () => {
        applyPreset(button.dataset.preset);
        form.requestSubmit();
      });
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();
      assessButton.disabled = true;
      assessButton.textContent = "Assessing...";
      const payload = {
        policy_number: document.querySelector("#policyNumber").value,
        claim_type: document.querySelector("#claimType").value,
        amount: document.querySelector("#amount").value,
        months_active: Number(document.querySelector("#monthsActive").value),
        documents: [...document.querySelectorAll('[name="documents"]:checked')].map(input => input.value)
      };
      try {
        const response = await fetch("/api/assess", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const decision = await response.json();
        if (!response.ok) throw new Error(decision.error || "Assessment failed");
        showDecision(decision);
      } catch (error) {
        result.className = "result-empty error";
        result.innerHTML = `<p>${error.message}</p>`;
      } finally {
        assessButton.disabled = false;
        assessButton.textContent = "Assess claim";
      }
    });
  </script>
</body>
</html>
