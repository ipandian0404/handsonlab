<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamGuard Claims Assessment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.1em;
            opacity: 0.95;
        }
        
        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        @media (max-width: 968px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }
        
        .card {
            background: white;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        
        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
            font-size: 0.95em;
        }
        
        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1em;
            font-family: monospace;
        }
        
        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .documents-input {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }
        
        .documents-input input {
            flex: 1;
        }
        
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 500;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #5568d3;
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .btn-add {
            width: 100%;
            margin-top: 5px;
        }
        
        .document-tag {
            display: inline-block;
            background: #e9ecef;
            padding: 5px 10px;
            border-radius: 4px;
            margin-right: 5px;
            margin-bottom: 5px;
            font-size: 0.9em;
        }
        
        .document-tag button {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            margin-left: 5px;
            font-weight: bold;
        }
        
        .decision {
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        
        .decision-approved {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        
        .decision-referred {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
        }
        
        .decision-pending-documents {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
        
        .decision-rejected {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        
        .decision-status {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        
        .decision-amount {
            font-size: 1.1em;
            margin-bottom: 10px;
        }
        
        .decision-reasons {
            margin-top: 10px;
        }
        
        .decision-reasons h4 {
            margin-bottom: 5px;
            font-size: 0.95em;
        }
        
        .reason-item {
            margin-left: 15px;
            font-size: 0.9em;
        }
        
        .test-cases {
            background: white;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        
        .test-cases h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        
        .test-case {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .test-case:hover {
            background: #e9ecef;
        }
        
        .test-case-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .test-case-description {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 8px;
        }
        
        .test-case-data {
            font-family: monospace;
            font-size: 0.85em;
            color: #555;
            background: white;
            padding: 8px;
            border-radius: 3px;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        
        .success-message {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        
        .synthetic-marker {
            background: #f0f0f0;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.9em;
            color: #666;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛡️ DreamGuard Claims Assessment</h1>
            <p class="subtitle">Deterministic insurance claim evaluation for training</p>
        </header>
        
        <div class="synthetic-marker">
            ℹ️ <strong>Synthetic Data Only:</strong> All records are fictional for training purposes.
        </div>
        
        <div class="layout">
            <div class="card">
                <h2>Submit Claim</h2>
                
                <div class="form-group">
                    <label for="policy">Policy Number *</label>
                    <input type="text" id="policy" placeholder="e.g., POL-12345" value="POL-00001">
                </div>
                
                <div class="form-group">
                    <label for="claimType">Claim Type *</label>
                    <select id="claimType">
                        <option value="life">Life</option>
                        <option value="disability">Disability</option>
                        <option value="travel">Travel (Unsupported)</option>
                        <option value="auto">Auto (Unsupported)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="amount">Amount (USD) *</label>
                    <input type="number" id="amount" placeholder="e.g., 100000" value="100000" step="0.01" min="0">
                </div>
                
                <div class="form-group">
                    <label for="months">Months Active *</label>
                    <input type="number" id="months" placeholder="e.g., 12" value="12" min="0" step="1">
                </div>
                
                <div class="form-group">
                    <label>Documents</label>
                    <div id="documents"></div>
                    <button class="btn btn-secondary btn-add" onclick="addDocumentField()">+ Add Document</button>
                </div>
                
                <button class="btn" onclick="submitClaim()" style="width: 100%; margin-top: 20px;">Assess Claim</button>
                
                <div id="result" style="margin-top: 20px;"></div>
            </div>
            
            <div class="card">
                <h2>Test Cases</h2>
                <p style="color: #666; margin-bottom: 15px; font-size: 0.95em;">Click a test case to populate the form and assess:</p>
                
                <div id="testCases"></div>
            </div>
        </div>
    </div>
    
    <script>
        const TEST_CASES = [
            {
                title: "✅ Approved Life Claim",
                description: "Complete life claim with 24 months active",
                data: {
                    policy_number: "POL-2001",
                    claim_type: "life",
                    amount: "250000.00",
                    months_active: 24,
                    documents: ["death_certificate", "identity_document"]
                }
            },
            {
                title: "✅ Approved Disability Claim",
                description: "Complete disability claim with 6 months active",
                data: {
                    policy_number: "POL-2002",
                    claim_type: "disability",
                    amount: "75000.00",
                    months_active: 6,
                    documents: ["medical_report", "identity_document"]
                }
            },
            {
                title: "⏳ Pending Documents (Life)",
                description: "Life claim missing identity_document (waiting period met)",
                data: {
                    policy_number: "POL-3002",
                    claim_type: "life",
                    amount: "120000.00",
                    months_active: 12,
                    documents: ["death_certificate"]
                }
            },
            {
                title: "⏳ Pending Documents (Disability)",
                description: "Disability claim missing medical_report (no documents)",
                data: {
                    policy_number: "POL-3005",
                    claim_type: "disability",
                    amount: "45000.00",
                    months_active: 12,
                    documents: ["identity_document"]
                }
            },
            {
                title: "🔄 Referred (Waiting Period)",
                description: "Life claim with complete docs but only 1 month active",
                data: {
                    policy_number: "POL-4002",
                    claim_type: "life",
                    amount: "150000.00",
                    months_active: 1,
                    documents: ["death_certificate", "identity_document"]
                }
            },
            {
                title: "🔄 Referred (Zero Months)",
                description: "Claim with 0 months active (policy just started)",
                data: {
                    policy_number: "POL-4001",
                    claim_type: "life",
                    amount: "200000.00",
                    months_active: 0,
                    documents: ["death_certificate", "identity_document"]
                }
            },
            {
                title: "🔄 Referred (Incomplete + Waiting)",
                description: "Waiting period check takes precedence over missing docs",
                data: {
                    policy_number: "POL-4004",
                    claim_type: "life",
                    amount: "100000.00",
                    months_active: 2,
                    documents: []
                }
            },
            {
                title: "❌ Rejected (Unsupported Type)",
                description: "Travel insurance is not supported",
                data: {
                    policy_number: "POL-7001",
                    claim_type: "travel",
                    amount: "10000.00",
                    months_active: 12,
                    documents: []
                }
            },
            {
                title: "❌ Rejected (Zero Amount)",
                description: "Claim amount must be greater than zero",
                data: {
                    policy_number: "POL-8001",
                    claim_type: "life",
                    amount: "0",
                    months_active: 12,
                    documents: ["death_certificate", "identity_document"]
                }
            },
            {
                title: "❌ Rejected (Negative Amount)",
                description: "Negative amount is invalid",
                data: {
                    policy_number: "POL-8002",
                    claim_type: "life",
                    amount: "-100.00",
                    months_active: 12,
                    documents: ["death_certificate", "identity_document"]
                }
            },
            {
                title: "✅ Boundary Test (3 Months)",
                description: "Exactly at 3-month threshold with complete docs",
                data: {
                    policy_number: "POL-5001",
                    claim_type: "life",
                    amount: "180000.00",
                    months_active: 3,
                    documents: ["death_certificate", "identity_document"]
                }
            },
            {
                title: "✅ Minimum Amount",
                description: "Valid claim with smallest positive amount ($0.01)",
                data: {
                    policy_number: "POL-8003",
                    claim_type: "disability",
                    amount: "0.01",
                    months_active: 3,
                    documents: ["medical_report", "identity_document"]
                }
            }
        ];
        
        function initializeUI() {
            renderTestCases();
            initializeDocuments();
        }
        
        function renderTestCases() {
            const container = document.getElementById('testCases');
            container.innerHTML = TEST_CASES.map((testCase, index) => `
                <div class="test-case" onclick="loadTestCase(${index})">
                    <div class="test-case-title">${testCase.title}</div>
                    <div class="test-case-description">${testCase.description}</div>
                    <div class="test-case-data">
                        ${testCase.data.claim_type} | $${parseFloat(testCase.data.amount).toLocaleString()} | ${testCase.data.months_active}mo
                    </div>
                </div>
            `).join('');
        }
        
        function loadTestCase(index) {
            const testCase = TEST_CASES[index];
            document.getElementById('policy').value = testCase.data.policy_number;
            document.getElementById('claimType').value = testCase.data.claim_type;
            document.getElementById('amount').value = testCase.data.amount;
            document.getElementById('months').value = testCase.data.months_active;
            
            const docsContainer = document.getElementById('documents');
            docsContainer.innerHTML = '';
            testCase.data.documents.forEach(doc => {
                addDocumentField(doc);
            });
            
            document.querySelector('.card').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        
        function initializeDocuments() {
            addDocumentField('death_certificate');
            addDocumentField('identity_document');
        }
        
        function addDocumentField(value = '') {
            const docsContainer = document.getElementById('documents');
            const id = 'doc-' + Math.random().toString(36).substr(2, 9);
            
            const div = document.createElement('div');
            div.className = 'documents-input';
            div.innerHTML = `
                <input type="text" placeholder="e.g., death_certificate" value="${value}">
                <button type="button" class="btn btn-secondary" onclick="removeDocumentField('${id}')">Remove</button>
            `;
            div.id = id;
            docsContainer.appendChild(div);
        }
        
        function removeDocumentField(id) {
            document.getElementById(id).remove();
        }
        
        function getDocuments() {
            const inputs = document.querySelectorAll('#documents input[type="text"]');
            return Array.from(inputs)
                .map(input => input.value.trim())
                .filter(value => value.length > 0);
        }
        
        async function submitClaim() {
            const resultDiv = document.getElementById('result');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'loading';
            loadingDiv.innerHTML = '<div class="spinner"></div>Assessing claim...';
            resultDiv.innerHTML = '';
            resultDiv.appendChild(loadingDiv);
            loadingDiv.style.display = 'block';
            
            const payload = {
                policy_number: document.getElementById('policy').value || 'POL-UNKNOWN',
                claim_type: document.getElementById('claimType').value,
                amount: parseFloat(document.getElementById('amount').value) || 0,
                months_active: parseInt(document.getElementById('months').value) || 0,
                documents: getDocuments()
            };
            
            try {
                const response = await fetch('/api/assess', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const decision = await response.json();
                displayDecision(decision, payload);
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error-message">
                        <strong>Error:</strong> Failed to assess claim. ${error.message}
                    </div>
                `;
            }
        }
        
        function displayDecision(decision, claim) {
            const resultDiv = document.getElementById('result');
            const statusClass = 'decision-' + decision.status.replace(/_/g, '-');
            const statusDisplay = decision.status
                .split('_')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');
            
            let html = `<div class="decision ${statusClass}">`;
            html += `<div class="decision-status">${statusDisplay}</div>`;
            html += `<div class="decision-amount">💰 Approved: $${parseFloat(decision.approved_amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>`;
            
            if (decision.reasons && decision.reasons.length > 0) {
                html += `<div class="decision-reasons">`;
                html += `<h4>Reasons:</h4>`;
                decision.reasons.forEach(reason => {
                    html += `<div class="reason-item">• ${reason}</div>`;
                });
                html += `</div>`;
            }
            
            html += `<div style="margin-top: 15px; font-size: 0.9em; color: inherit; opacity: 0.8;">`;
            html += `Policy: <strong>${claim.policy_number}</strong> | `;
            html += `Type: <strong>${claim.claim_type}</strong> | `;
            html += `Months: <strong>${claim.months_active}</strong>`;
            html += `</div>`;
            html += `</div>`;
            
            resultDiv.innerHTML = html;
        }
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', initializeUI);
    </script>
</body>
</html>
